# Netlify Configuration for Global Job Search
# Static site deployment

[build]
  # No build command needed - pure static HTML/CSS/JS
  publish = "."

# Custom headers for performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty URLs and SPA fallback (not needed for static but good to have)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200